version: "2"

run:
  timeout: 5m
  tests: true

linters:
  enable:
    # Essential
    - errcheck
    - govet
    - staticcheck
    - unused
    - ineffassign

    # Style
    - gofmt
    - goimports
    - misspell
    - revive

    # Bugs
    - bodyclose
    - gosec
    - nilerr
    - nilnil
    - rowserrcheck
    - sqlclosecheck

    # Performance
    - prealloc
    - unconvert

    # Best practices
    - errorlint
    - errname
    - contextcheck
    - noctx

linters-settings:
  goimports:
    local-prefixes: {{.Module}}

  govet:
    check-shadowing: true

  errcheck:
    check-type-assertions: true
    check-blank: true

  revive:
    rules:
      - name: unexported-return
      - name: unused-parameter
      - name: unused-receiver
      - name: context-as-argument
      - name: error-return
      - name: error-strings
      - name: error-naming
      - name: if-return
      - name: var-naming
      - name: package-comments
      - name: range
      - name: receiver-naming
      - name: indent-error-flow
      - name: superfluous-else

issues:
  exclude-rules:
    # Exclude test files from certain linters
    - path: '_test\.go'
      linters:
        - gosec
        - errcheck
